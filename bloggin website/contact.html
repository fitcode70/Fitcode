<title>Contact Us - FitCode - contact page</title>

href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}





.contact-section{
    padding:60px 8%;
    
}

.contact-container{
    display:flex;
   background: #e7f8ff;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 15px 40px rgba(0,0,0,.15);
    border: solid skyblue 4px;
}

/* LEFT */

.contact-left{
    flex:1;
    background:#ffda62;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px;
    clip-path:polygon(0 0,80% 0,100% 50%,80% 100%,0 100%);
}

.contact-left img{
    width:100%;
    max-width:380px;
}

/* RIGHT */

.contact-right{
    flex:1;
    padding:70px;
    
}

.contact-right h2{
    text-align:center;
    margin-bottom:50px;
    font-size:2.5rem;
    color:#111827;
}

.input-box{
    position:relative;
    margin-bottom:35px;
}

.input-box input,
.input-box textarea{
    width:100%;
    border:none;
    border-bottom:2px solid #ddd;
    outline:none;
    background:none;
    padding:12px 0;
    font-size:1rem;
}

.input-box label{
    position:absolute;
    left:0;
    top:12px;
    color:#888;
    pointer-events:none;
    transition:.3s;
}

.input-box input:focus ~ label,
.input-box input:valid ~ label,
.input-box textarea:focus ~ label,
.input-box textarea:valid ~ label{
    top:-12px;
    font-size:.8rem;
    color:#4dabf7;
}

.contact-right button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:50px;
    background:#691b1b;
    color:#fff;
    font-size:1.1rem;
    cursor:pointer;
    transition:.3s;
}

.contact-right button:hover{
    transform:translateY(-3px);
}

.socials{
    margin-top:40px;
    display:flex;
    justify-content:center;
    gap:20px;
}

.socials a{
    width:50px;
    height:50px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#fff;
    text-decoration:none;
    font-size:1.2rem;
    transition:.3s;
}

.socials a:nth-child(1){
    background:#1877f2;
}

.socials a:nth-child(2){
    background:#e1306c;
}

.socials a:nth-child(3){
    background:#0a66c2;
}

.socials a:hover{
    transform:translateY(-5px);
}

/* FOOTER */

footer{
background:#020617;
padding:40px;
text-align:center;
color:#94a3b8;
}
/* RESPONSIVE */

@media(max-width:992px){

    .contact-container{
        flex-direction:column;
    }

    .contact-left{
        clip-path:none;
        min-height:250px;
    }

    .contact-right{
        padding:40px 25px;
    }
}

@media(max-width:768px){

    nav{
        display:block;
    }

    .menu-btn{
        display:block;
    }

    .footer-container{
        grid-template-columns:1fr;
        text-align:center;
    }

    .footer-social{
        justify-content:center;
    }

    .contact-right h2{
        font-size:2rem;
    }
}

#successPopup{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:#22c55e;
    color:white;
    padding:18px 30px;
    border-radius:12px;
    font-weight:600;
    font-size:1rem;
    z-index:9999;
    display:none;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}
#submitBtn{
    position:relative;
}

#loader{
    display:none;
    width:18px;
    height:18px;
    border:3px solid rgba(255,255,255,.4);
    border-top:3px solid white;
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin:auto;
}

@keyframes spin{

    0%{
        transform:rotate(0deg);
    }

    100%{
        transform:rotate(360deg);
    }

}
</style>
</head>
<body>

<header>
   


<div class="logo">FitCode</div>

<nav>
<ul>

<li><a href="about.html">about us</a></li>

</ul>
</nav>

</header>

<section class="contact-section">

    <div class="contact-container">

        <div class="contact-left">

            <img src="images/contact logo.png" alt="Contact">

        </div>

        <div class="contact-right">

            <h2>Contact Us</h2>

           <form id="contactForm">

    <div class="input-box">
        <input type="text" name="name" required>
        <label>Full Name</label>
    </div>

    <div class="input-box">
        <input type="email" name="email" required>
        <label>Email-must compulsory</label>
    </div>

    <div class="input-box">
        <textarea name="message" rows="4" required></textarea>
        <label>Your Message</label>
    </div>

    <button class="btn" id="submitBtn" type="submit">
    <span id="btnText">Send Message</span>
    <span id="loader"></span>
</button>

</form>

           <div class="socials">
       

    <a href="https://www.facebook.com/share/18mG8Bs5VP/" target="_blank" class="fb">
        <i class="fab fa-facebook-f"></i>
    </a>

    <a href="https://www.instagram.com/fitcode.7?igsh=eWdtMWlxMXlvd3kw" target="_blank" class="ig">
        <i class="fab fa-instagram"></i>
    </a>

    <a href="https://t.me/fitcode70" target="_blank" class="tel">
    <i class="fab fa-telegram-plane"></i>
</a>

</div>
    </div>

        </div>

    </div>

</section>


<footer>
    © 2026 FitCode. All Rights Reserved.<br>
    <a href="privacy.html">Privacy Policy</a> /

</footer>
<div id="successPopup">
    ✅ Message Sent Successfully!
</div>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>

emailjs.init("F5VzrXWSzeltRS_ew");

const form =
document.getElementById("contactForm");

const submitBtn =
document.getElementById("submitBtn");

const btnText =
document.getElementById("btnText");

const loader =
document.getElementById("loader");

form.addEventListener(
"submit",
function(e){

    e.preventDefault();

    submitBtn.disabled = true;

    btnText.style.display = "none";
    loader.style.display = "block";

    emailjs.sendForm(
        "service_eobb519",
        "template_hq8qvv6",
        this
    )

    .then(()=>{

        loader.style.display = "none";

        btnText.style.display =
        "block";

        btnText.textContent =
        "Message Sent ✓";

        document
        .getElementById(
        "successPopup"
        )
        .style.display =
        "block";

        form.reset();

        setTimeout(()=>{

            document
            .getElementById(
            "successPopup"
            )
            .style.display =
            "none";

            btnText.textContent =
            "Send Message";

            submitBtn.disabled =
            false;

        },3000);

    })

    .catch((error)=>{

        console.log(error);

        loader.style.display =
        "none";

        btnText.style.display =
        "block";

        btnText.textContent =
        "Try Again";

        submitBtn.disabled =
        false;

        alert(
        "Message Failed To Send"
        );

    });

});

</script>
</body>
