<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="description"
content="FitCode provides fitness tips, workout plans, healthy diet guides, and nutrition blogs to help you achieve your fitness goals.">

<meta name="keywords"
content="fitness, workout, diet plan, nutrition, weight gain, weight loss, bodybuilding, healthy lifestyle">

<meta name="author"
content="FitCode">
<link rel="icon" sizes="512x512" href="images/main logo.png">
<link rel="apple-touch-icon" href="images/main logo.png">
    <title>Workout Plans | FitCode | blogs</title>
    <style>
        *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:linear-gradient(
        135deg,
        #0f172a,
        #1e293b,
        #334155
    );
}

.notice{
    width:100%;
    max-width:700px;
    text-align:center;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.15);
    border-radius:25px;
    padding:50px 40px;
    color:white;
    box-shadow:
    0 20px 40px rgba(0,0,0,.3);
}

.notice h1{
    font-size:3rem;
    margin-bottom:20px;
    color:#38bdf8;
}

.notice h3{
    font-size:1.1rem;
    font-weight:400;
    line-height:1.8;
    color:#cbd5e1;
    margin-bottom:15px;
}

.btn{
    margin-top:20px;
    border:none;
    outline:none;
    padding:14px 30px;
    background:#38bdf8;
    color:#0f172a;
    font-size:1rem;
    font-weight:600;
    border-radius:12px;
    cursor:pointer;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-4px);
    box-shadow:
    0 10px 25px rgba(56,189,248,.4);
}

.btn:active{
    transform:scale(.96);
}

/* TABLET */

@media(max-width:768px){

    .notice{
        padding:35px 25px;
    }

    .notice h1{
        font-size:2.2rem;
    }

    .notice h3{
        font-size:1rem;
    }

}

/* MOBILE */

@media(max-width:480px){

    .notice{
        padding:30px 20px;
    }

    .notice h1{
        font-size:1.8rem;
    }

    .notice h3{
        font-size:.95rem;
        line-height:1.7;
    }

    .btn{
        width:100%;
    }

}

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:140px;
    height:50px;
    background:#691b1b;
    color:#fff;
    text-decoration:none;
    font-size:16px;
    font-weight:600;
    border:none;
    border-radius:12px;
    cursor:pointer;
    transition:all 0.15s ease;
    box-shadow:0 6px 0 #000000;
}

.btn:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 0 #0ea5e9;
    color: #70d4ff;
}

.btn:active{
    transform:translateY(4px);
    box-shadow:0 2px 0 #0ea5e9;
    
}
    </style>
</head>
<body>
    <div class="notice">
        <h1>Hello, Guys</h1>
        <h3>The content will be available soon. Please be patient. If you would like more details or have any questions, feel free to contact us.
</h3>
<h3>Thank you 😃😉</h3>
 <a href="about.html" class="btn">Learn More</a>
    </div>
</body>
</html>
